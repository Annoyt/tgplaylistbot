# Cap container logs (json-file has no limit by default and grows forever).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Self-hosted Telegram Bot API server — lifts the send limit from 50MB
  # (cloud) to 2GB and lets the bot pass local file paths. Secrets come from
  # .env via ${...} substitution, so nothing sensitive lives in git.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: musicbot-botapi
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=true
    volumes:
      - tgapi-data:/var/lib/telegram-bot-api
      # Downloads shared with the bot (same in-container path, so local-mode
      # sends can pass file paths). Not host /tmp: see deploy.sh.
      - ./downloads:/tmp/musicbot
    ports:
      - "8081:8081"

  platform:
    build: .
    container_name: musicbot-platform
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - telegram-bot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the DB / cookies.txt on the host — without this every redeploy
      # wipes settings (see git history: this was previously commented out).
      - ./data:/app/data
      - ./downloads:/tmp/musicbot
      # Shared with the bot-api server so getFile downloads are readable.
      - tgapi-data:/var/lib/telegram-bot-api
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081

volumes:
  tgapi-data:
