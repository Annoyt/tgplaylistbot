openapi: 3.0.3
info:
  title: VK Music Bot API
  description: |
    API для управления музыкальным ботом ВКонтакте.
    
    Предоставляет endpoints для управления плейлистами, поиска треков,
    управления очередью воспроизведения и получения информации о состоянии бота.
  version: 1.0.0
  contact:
    name: VK Music Bot Support
    url: https://github.com/vkmusicbot/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://api.vkmusicbot.example.com/v1
    description: Production server

tags:
  - name: System
    description: Системные endpoints для проверки состояния API
  - name: Tracks
    description: Управление треками и поиск
  - name: Playlists
    description: Управление плейлистами
  - name: Queue
    description: Управление очередью воспроизведения

paths:
  /health:
    get:
      summary: Проверка состояния API
      description: Возвращает статус работоспособности API и основную информацию о состоянии
      tags:
        - System
      operationId: getHealth
      responses:
        '200':
          description: API работает нормально
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 1.0.0
                uptime: 3600
                timestamp: "2026-03-03T15:30:00Z"
        '503':
          description: API недоступен или в состоянии деградации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                version: 1.0.0
                uptime: 3600
                timestamp: "2026-03-03T15:30:00Z"

  /status:
    get:
      summary: Детальный статус бота
      description: Возвращает детальную информацию о состоянии бота и его компонентов
      tags:
        - System
      operationId: getStatus
      responses:
        '200':
          description: Информация о статусе успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                bot:
                  connected: true
                  username: "VKMusicBot"
                player:
                  isPlaying: true
                  currentTrack:
                    id: "track_123"
                    title: "Track Name"
                    artist: "Artist Name"
                    duration: 180
                  queueLength: 5
                  volume: 75

  /tracks/search:
    get:
      summary: Поиск треков
      description: Ищет треки по запросу в VK и других источниках
      tags:
        - Tracks
      operationId: searchTracks
      parameters:
        - name: q
          in: query
          description: Поисковый запрос
          required: true
          schema:
            type: string
            example: "The Beatles Yesterday"
        - name: limit
          in: query
          description: Максимальное количество результатов
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10
        - name: offset
          in: query
          description: Смещение для пагинации
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        '200':
          description: Успешный поиск
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTracksResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queue:
    get:
      summary: Получить текущую очередь
      description: Возвращает список треков в очереди воспроизведения
      tags:
        - Queue
      operationId: getQueue
      responses:
        '200':
          description: Очередь успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
    
    post:
      summary: Добавить трек в очередь
      description: Добавляет трек в конец очереди воспроизведения
      tags:
        - Queue
      operationId: addToQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToQueueRequest'
      responses:
        '201':
          description: Трек успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Статус работоспособности API
          example: ok
        version:
          type: string
          description: Версия API
          example: "1.0.0"
        uptime:
          type: integer
          description: Время работы в секундах
          example: 3600
        timestamp:
          type: string
          format: date-time
          description: Текущее время сервера
          example: "2026-03-03T15:30:00Z"

    StatusResponse:
      type: object
      required:
        - bot
        - player
      properties:
        bot:
          type: object
          properties:
            connected:
              type: boolean
              description: Подключен ли бот к VK
              example: true
            username:
              type: string
              description: Имя бота
              example: "VKMusicBot"
        player:
          type: object
          properties:
            isPlaying:
              type: boolean
              description: Воспроизводится ли сейчас трек
              example: true
            currentTrack:
              $ref: '#/components/schemas/Track'
            queueLength:
              type: integer
              description: Количество треков в очереди
              example: 5
            volume:
              type: integer
              description: Текущая громкость (0-100)
              example: 75

    Track:
      type: object
      required:
        - id
        - title
        - artist
        - duration
      properties:
        id:
          type: string
          description: Уникальный идентификатор трека
          example: "track_123"
        title:
          type: string
          description: Название трека
          example: "Yesterday"
        artist:
          type: string
          description: Исполнитель
          example: "The Beatles"
        duration:
          type: integer
          description: Длительность в секундах
          example: 125
        thumbnail:
          type: string
          format: uri
          description: URL обложки трека
          example: "https://example.com/cover.jpg"
        source:
          type: string
          enum: [vk, youtube, spotify]
          description: Источник трека
          example: vk

    SearchTracksResponse:
      type: object
      required:
        - tracks
        - total
      properties:
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        total:
          type: integer
          description: Общее количество найденных треков
          example: 100

    QueueResponse:
      type: object
      required:
        - tracks
        - currentIndex
      properties:
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        currentIndex:
          type: integer
          description: Индекс текущего трека (-1 если ничего не играет)
          example: 0
        isLooping:
          type: boolean
          description: Включен ли режим повтора
          example: false
        isShuffled:
          type: boolean
          description: Включен ли режим перемешивания
          example: false

    AddToQueueRequest:
      type: object
      required:
        - trackId
      properties:
        trackId:
          type: string
          description: Идентификатор трека для добавления
          example: "track_123"
        position:
          type: integer
          description: Позиция в очереди (если не указана - добавляется в конец)
          example: 0

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Код ошибки
          example: "BAD_REQUEST"
        message:
          type: string
          description: Описание ошибки
          example: "Параметр 'q' обязателен для поиска"
        details:
          type: object
          description: Дополнительные детали ошибки
