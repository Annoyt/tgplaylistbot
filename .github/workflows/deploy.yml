name: Deploy to Server

on:
  push:
    branches: [feature/platform-musicbot, main]
  workflow_dispatch:

# One deploy at a time: a newer push waits for the running deploy to finish.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} 'bash -s' << 'ENDSCRIPT'
            set -e

            # Создать папку проекта
            PROJECT_DIR="/root/tgplaylistbot"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/Annoyt/tgplaylistbot.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout feature/platform-musicbot
            git reset --hard origin/feature/platform-musicbot

            # Собираем образ, пока старый бот работает, потом быстро меняем
            # контейнер (простой — секунды, а не вся сборка). Без `compose down`
            # и pkill: pkill с хоста убивал python run.py внутри контейнера.
            # Скрипт падает, если новый бот не начал polling.
            ./deploy.sh
          ENDSCRIPT
