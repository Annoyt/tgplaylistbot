name: Deploy to Server

on:
  push:
    branches: [feature/platform-musicbot, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add host to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} 'bash -s' << 'ENDSCRIPT'
            set -e
            
            # Установить зависимости системы
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git python3 python3-pip python3-venv
            
            # Создать папку проекта
            PROJECT_DIR="/root/tgplaylistbot"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/Annoyt/tgplaylistbot.git "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Создать venv с pip
            if [ ! -f ".venv/bin/pip" ]; then
              echo "Creating virtual environment..."
              rm -rf .venv
              python3 -m venv .venv --without-pip
              .venv/bin/python -m ensurepip --upgrade
            fi
            
            # Установить зависимости
            .venv/bin/pip install -r requirements.txt --quiet
            
            # Остановить старый процесс бота если есть
            pkill -f "python.*bot" || true
            
            # Запустить бота в фоне
            nohup .venv/bin/python -m bot > bot.log 2>&1 &
            
            echo "✅ Деплой завершён! Бот запущен."
            echo "Логи: tail -f /root/tgplaylistbot/bot.log"
          ENDSCRIPT
