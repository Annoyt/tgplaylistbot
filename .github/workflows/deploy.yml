name: Deploy to Server

on:
  push:
    branches: [feature/platform-musicbot, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add host to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} 'bash -s' << 'ENDSCRIPT'
            set -e
            
            export DEBIAN_FRONTEND=noninteractive
            
            # Установить Docker если нет
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              apt-get update -qq
              apt-get install -y -qq ca-certificates curl gnupg
              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=\"$(dpkg --print-architecture)\" signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian \"$(. /etc/os-release && echo \"$VERSION_CODENAME\")\" stable" > /etc/apt/sources.list.d/docker.list
              apt-get update -qq
              apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi
            
            # Создать папку проекта
            PROJECT_DIR="/root/tgplaylistbot"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/Annoyt/tgplaylistbot.git "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Создать .env из GitHub Secrets
            if [ ! -f ".env" ]; then
              echo "Creating .env file from secrets..."
            fi
            cat > .env << 'ENVFILE'
# ── Web Platform ──────────────────────────────
SECRET_KEY=${{ secrets.SECRET_KEY }}
ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

# ── OpenWeatherMap ────────────────────────────
OPENWEATHERMAP_API_KEY=${{ secrets.OPENWEATHERMAP_API_KEY }}

# ── Telegram MusicBot ─────────────────────────
TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}

# ── VK Music ──────────────────────────────────
VK_TOKEN=${{ secrets.VK_TOKEN }}

# ── Spotify ───────────────────────────────────
SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}

# ── AcoustID ──────────────────────────────────
ACOUSTID_API_KEY=${{ secrets.ACOUSTID_API_KEY }}

# ── Limits ────────────────────────────────────
MAX_FILE_SIZE_MB=49
DOWNLOAD_DIR=/tmp/musicbot
ENVFILE
            
            # Создать папку для данных
            mkdir -p data /tmp/musicbot
            
            # Запустить через Docker Compose
            docker compose down || true
            docker compose up -d --build
            
            echo "✅ Деплой завершён!"
            echo ""
            echo "⚠️  НЕ ЗАБУДЬТЕ: Отредактировать /root/tgplaylistbot/.env на сервере!"
            echo "Проверка статуса: docker ps | grep musicbot"
            echo "Логи: docker logs -f musicbot-platform"
          ENDSCRIPT
