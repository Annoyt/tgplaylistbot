name: Deploy to Server

on:
  push:
    branches: [feature/platform-musicbot, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} 'bash -s' << 'ENDSCRIPT'
            set -e

            export DEBIAN_FRONTEND=noninteractive

            # Установить зависимости системы
            apt-get update -qq
            apt-get install -y -qq git python3 python3-pip python3-venv python3-full

            # Создать папку проекта
            PROJECT_DIR="/root/tgplaylistbot"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/Annoyt/tgplaylistbot.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch origin
            git checkout feature/platform-musicbot
            git pull origin feature/platform-musicbot

            echo "Cleaning up old python processes to free port 8000..."
            pkill -f "python.*run.py" || true
            pkill -f "uvicorn" || true
            sleep 2

            echo "Rebuilding Docker containers..."
            docker compose down || true
            docker compose up -d --build

            echo "Cleaning up old docker resources..."
            docker system prune -af

            sleep 3
            echo "✅ Деплой завершён!"
            echo "Логи: docker logs --tail 50 musicbot-platform"
          ENDSCRIPT
